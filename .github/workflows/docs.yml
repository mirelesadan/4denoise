name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m pip check
      - name: Build HTML with warnings treated as errors
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Save HTML preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 7
          if-no-files-found: warn

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m pip check
      - name: Check guide links
        run: python -m sphinx -b linkcheck -W --keep-going docs docs/_build/linkcheck
      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-link-report
          path: |
            docs/_build/linkcheck/output.txt
            docs/_build/linkcheck/output.json
          retention-days: 7
          if-no-files-found: warn

  demo-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs-test]"
          python -m pip check
      - name: Execute the mini-data DEMO in a fresh kernel
        run: python scripts/execute_demo.py
      - name: Save executed DEMO (including partial output on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-mini-data-demo
          path: docs/_build/demo/*.ipynb
          retention-days: 7
          if-no-files-found: warn
