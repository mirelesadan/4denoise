name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MPLBACKEND: Agg
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m pip check
      - name: Build HTML with warnings treated as errors
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: Package the validated site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html
      - name: Save HTML preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 7
          if-no-files-found: warn

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m pip check
      - name: Check guide links
        run: python -m sphinx -b linkcheck -W --keep-going docs docs/_build/linkcheck
      - name: Save link report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-link-report
          path: |
            docs/_build/linkcheck/output.txt
            docs/_build/linkcheck/output.json
          retention-days: 7
          if-no-files-found: warn

  demo-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lightweight notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs-test]"
          python -m pip check
      - name: Execute the mini-data DEMO in a fresh kernel
        run: python scripts/execute_demo.py
      - name: Save executed DEMO (including partial output on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: executed-mini-data-demo
          path: docs/_build/demo/*.ipynb
          retention-days: 7
          if-no-files-found: warn

  # Reuse the core suite to gate this exact main revision, not a different run.
  site-tests:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/tests.yml

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [docs-build, docs-links, demo-notebook, site-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy validated documentation
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify published pages and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for page in index.html getting-started/quickstart.html reference/hyperdata.html _static/styles/furo.css searchindex.js; do
            echo "Checking ${SITE_URL%/}/$page"
            curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors --max-time 10 "${SITE_URL%/}/$page" --output /dev/null
          done
