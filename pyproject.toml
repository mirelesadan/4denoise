[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fourdenoise-main"
version = "1.0.0"
description = "4Denoise classroom demo utilities"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "scikit-image>=0.22,<1",
  "scikit-learn>=1.4,<2",
  "h5py>=3.10,<4",
  "tqdm>=4.66,<5",
  "opencv-python-headless>=4.10,<5",
  "numba>=0.61,<1",
  "tensorly>=0.9,<1",
  "threadpoolctl>=3,<4",
]

[project.optional-dependencies]
simulation = [
  "abtem>=1,<2",
  "ase>=3.23",
  "scikit-optimize>=0.10,<1",
]
notebook = [
  "jupyterlab>=4.2,<5",
  "notebook>=7.3,<8",
  "ipykernel>=6.29,<7",
  "py4DSTEM==0.14.18",
  "ncempy>=1.11",
  "emdfile>=0.0.16",
  "matplotlib-scalebar>=0.9",
  "xgboost",
]
bm = ["bm3d", "bm4d"]

[tool.setuptools]
py-modules = [
  "fourdenoise",
  "fourdenoise_geometry",
  "abTEM_helpers",
  "rippleModel",
  "kin_diff_sim"
]
